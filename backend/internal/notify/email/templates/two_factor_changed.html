<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#05070f;font-family:Arial,Helvetica,sans-serif;color:#e7ecf7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#05070f;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#0b1020;border:1px solid #1e2944;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#c4b5fd;font-weight:bold;">Nebula Exchange</td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:22px;font-weight:bold;color:#e7ecf7;">Two-factor authentication was {{.ChangeDescription}}</td>
            </tr>
            <tr>
              <td style="padding-top:12px;font-size:14px;line-height:22px;color:#8d98b3;">
                Hi <strong style="color:#e7ecf7;">{{.Username}}</strong>, two-factor authentication on your account was {{.ChangeDescription}} at {{.ChangedAt}}.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;line-height:18px;color:#5d6883;">
                If this wasn't you, reset your password right away and contact support.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
